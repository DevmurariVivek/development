<template>
    <div class="slds-box">
        <template if:true={phoneFieldList}>
            <ul>
                <template for:each={phoneFieldList} for:item="field">
                    <li key={field.label}>
                        <a href="javascript:void(0);" data-phone={field.value} onclick={handlePhoneClick}>
                            {field.value}
                        </a>
                    </li>
                </template>
            </ul>
        </template>
        <template if:false={phoneFieldList}>
            <p>No phone numbers found for this record.</p>
        </template>
    </div>
</template>
